version: 1
flags:
  new-checkout:
    enabled: true
    description: Redesigned checkout flow
    tags:
      - checkout
      - experiment
    rollout: 50
    rules:
      - conditions:
          plan: pro
        enabled: true
      - conditions:
          country: { $in: [US, CA] }
        rollout: 80
    variants:
      - name: control
        weight: 50
      - name: new-flow
        weight: 50

  dark-mode:
    enabled: false
    description: Dark mode toggle
    tags:
      - ui

  beta-features:
    enabled: true
    description: Beta features for internal users
    rules:
      - conditions:
          email: '*@company.com'
        enabled: true
    rollout: 0

  payment-v2:
    enabled: true
    description: New payment processing
    rollout: 10
