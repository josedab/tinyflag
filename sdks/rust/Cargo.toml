[package]
name = "tinyflag"
version = "0.1.0"
edition = "2021"
description = "Zero-dependency feature flag evaluator for Rust and WebAssembly"
license = "MIT"
repository = "https://github.com/tinyflag/tinyflag"
keywords = ["feature-flags", "wasm", "feature-toggle"]
categories = ["wasm", "config"]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["std"]
std = []
wasm = ["wasm-bindgen", "serde-wasm-bindgen"]

[dependencies]
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
wasm-bindgen = { version = "0.2", optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }

[dev-dependencies]
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
