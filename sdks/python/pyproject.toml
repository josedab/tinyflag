[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tinyflag"
version = "0.1.0"
description = "File-driven, zero-dependency feature flag SDK for Python"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [{name = "josedab"}]
keywords = ["feature-flags", "feature-toggles", "a-b-testing", "rollout", "yaml"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.urls]
Homepage = "https://github.com/josedab/tinyflag"
Repository = "https://github.com/josedab/tinyflag"
