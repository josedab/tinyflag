apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: flagconfigs.tinyflag.io
spec:
  group: tinyflag.io
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - source
              properties:
                source:
                  type: object
                  properties:
                    gitRepo:
                      type: string
                      description: "Git repository URL containing flag files"
                    branch:
                      type: string
                      default: "main"
                      description: "Git branch to watch"
                    path:
                      type: string
                      default: "flags.yml"
                      description: "Path to flag file within the repo"
                    pollInterval:
                      type: string
                      default: "60s"
                      description: "Poll interval for git changes"
                configMap:
                  type: object
                  properties:
                    name:
                      type: string
                      description: "Name of the ConfigMap to create/update"
                    namespace:
                      type: string
                      description: "Namespace for the ConfigMap (defaults to FlagConfig namespace)"
                    key:
                      type: string
                      default: "flags.yml"
                      description: "Key within the ConfigMap"
                namespaces:
                  type: array
                  items:
                    type: string
                  description: "Additional namespaces to sync ConfigMaps to"
                sidecar:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                      default: false
                      description: "Enable sidecar injection"
                    port:
                      type: integer
                      default: 8080
                      description: "Port for the sidecar HTTP endpoint"
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum: ["Syncing", "Synced", "Error"]
                lastSyncTime:
                  type: string
                  format: date-time
                lastCommit:
                  type: string
                message:
                  type: string
                configMapRef:
                  type: string
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Last Sync
          type: date
          jsonPath: .status.lastSyncTime
        - name: Commit
          type: string
          jsonPath: .status.lastCommit
          priority: 1
  scope: Namespaced
  names:
    plural: flagconfigs
    singular: flagconfig
    kind: FlagConfig
    shortNames:
      - fc
