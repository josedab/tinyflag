name: Bug Report
description: Report a bug in TinyFlag
labels: ['bug']
body:
  - type: input
    id: version
    attributes:
      label: TinyFlag version
      placeholder: '0.1.0'
    validations:
      required: true
  - type: dropdown
    id: package
    attributes:
      label: Package
      options:
        - tinyflag (core)
        - tinyflag-react
        - tinyflag-vue
        - tinyflag-svelte
        - tinyflag-cli
    validations:
      required: true
  - type: dropdown
    id: runtime
    attributes:
      label: Runtime
      options:
        - Node.js
        - Bun
        - Deno
        - Cloudflare Workers
        - Other
    validations:
      required: true
  - type: input
    id: runtime-version
    attributes:
      label: Runtime version
      placeholder: 'Node.js 22.0.0'
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Minimal steps or code to reproduce the issue.
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened.
    validations:
      required: true
  - type: textarea
    id: flags-config
    attributes:
      label: Flag configuration (flags.yml)
      description: Relevant flag configuration, if applicable.
      render: yaml
