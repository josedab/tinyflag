name: Feature Request
description: Suggest a new feature or improvement
labels: ['enhancement']
body:
  - type: dropdown
    id: package
    attributes:
      label: Package
      options:
        - tinyflag (core)
        - tinyflag-react
        - tinyflag-vue
        - tinyflag-svelte
        - tinyflag-cli
        - New package
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this feature solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How would you like this to work?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any alternative approaches you've considered.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Any other context, code samples, or screenshots.
