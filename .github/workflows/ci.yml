name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -r build

      - name: Test
        run: pnpm -r test

      - name: Check bundle size
        run: |
          SIZE=$(gzip -c packages/core/dist/index.js | wc -c)
          echo "Core bundle size: ${SIZE} bytes gzipped"
          if [ "$SIZE" -gt 8192 ]; then
            echo "Bundle size exceeds 8KB limit!"
            exit 1
          fi
          echo "Bundle size within limit"

      - name: Validate example flags
        run: node packages/cli/dist/index.js validate examples/flags.yml
